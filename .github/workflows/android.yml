name: Build Android APK & Web Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-web:
    name: Build Web Assets (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Web Application
        run: |
          if [ -f "package.json" ]; then
            echo "package.json found at root level"
            npm install
            npm run build
          else
            TARGET_DIR=$(dirname $(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1))
            if [ -n "$TARGET_DIR" ] && [ -f "$TARGET_DIR/package.json" ]; then
              echo "package.json found in directory: $TARGET_DIR"
              cd "$TARGET_DIR"
              npm install
              npm run build
              mkdir -p "$GITHUB_WORKSPACE/dist"
              cp -r dist/* "$GITHUB_WORKSPACE/dist/" 2>/dev/null || true
            else
              echo "CRITICAL ERROR: package.json not found in repository."
              exit 1
            fi
          fi

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: dist/

  build-android:
    name: Build Android APK (GeckoView / WebView)
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Web Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-web
          path: dist/

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Web Build Output
        run: ls -la dist/
